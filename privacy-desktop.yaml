      - heading "隐私政策" [level=1] [ref=e29]
      - generic [ref=e30]:
        - paragraph [ref=e31]:
          - strong [ref=e32]: 最后更新：2026年5月2日
        - paragraph [ref=e33]: 本隐私政策描述了格物致知（gwzz.xyz，以下简称”本站”）在您访问和使用本站时如何收集、使用和保护您的个人信息。
        - heading "1. 信息收集" [level=2] [ref=e34]
        - heading "1.1 自动收集的信息" [level=3] [ref=e35]
        - paragraph [ref=e36]: 当您访问本站时，我们可能会自动收集以下信息：
        - list [ref=e37]:
          - listitem [ref=e38]:
            - strong [ref=e39]: 日志数据
            - text: ：您的 IP 地址、浏览器类型、操作系统、访问页面、访问时间和来源页面。这些数据由 GitHub Pages 服务器日志自动记录。
          - listitem [ref=e40]:
            - strong [ref=e41]: Cookie 和类似技术
            - text: ：详见我们的
            - link "Cookie 政策" [ref=e42] [cursor=pointer]:
              - /url: /cookie-policy/
            - text: 。
        - heading "1.2 您主动提供的信息" [level=3] [ref=e43]
        - list [ref=e44]:
          - listitem [ref=e45]:
            - strong [ref=e46]: 搜索查询
            - text: ：当您使用站内搜索功能时，搜索关键词仅在本地处理，不会发送到我们的服务器。
          - listitem [ref=e47]:
            - strong [ref=e48]: 主题偏好
            - text: ：您选择的深色/浅色主题偏好存储在浏览器本地存储（localStorage）中。
        - heading "2. 第三方服务" [level=2] [ref=e49]
        - heading "2.1 Google AdSense" [level=3] [ref=e50]
        - paragraph [ref=e51]:
          - text: 本站使用 Google AdSense 展示广告。Google 可能使用 Cookie 和类似技术来展示基于您过往访问本站或其他网站的广告。您可以通过
          - link "Google 广告设置" [ref=e52] [cursor=pointer]:
            - /url: https://adssettings.google.com/
          - text: 管理您的广告偏好，或通过
          - link "www.youronlinechoices.com" [ref=e53] [cursor=pointer]:
            - /url: https://www.youronlinechoices.com/
          - text: 选择退出个性化广告。
        - heading "2.2 Google Analytics" [level=3] [ref=e54]
        - paragraph [ref=e55]:
          - text: 本站可能使用 Google Analytics 分析网站流量。Google Analytics 使用 Cookie 收集匿名化的访问数据。您可以通过安装
          - link "Google Analytics 选择退出浏览器插件" [ref=e56] [cursor=pointer]:
            - /url: https://tools.google.com/dlpage/gaoptout
          - text: 退出数据收集。
        - heading "2.3 GitHub Pages" [level=3] [ref=e57]
        - paragraph [ref=e58]:
          - text: 本站托管在 GitHub Pages 上。GitHub 可能收集服务器日志数据，请参阅
          - link "GitHub 隐私声明" [ref=e59] [cursor=pointer]:
            - /url: https://docs.github.com/zh/site-policy/privacy-policies/github-privacy-statement
          - text: 。
        - heading "2.4 CDN 资源" [level=3] [ref=e60]
        - paragraph [ref=e61]: 本站部分资源（如 Mermaid.js 图表库）通过 jsDelivr CDN 加载。CDN 服务商可能会记录访问日志。
        - heading "3. 信息使用" [level=2] [ref=e62]
        - paragraph [ref=e63]: 我们收集的信息仅用于以下目的：
        - list [ref=e64]:
          - listitem [ref=e65]: 提供和维护网站服务
          - listitem [ref=e66]: 分析网站使用情况，改善用户体验
          - listitem [ref=e67]: 展示相关广告以支持站点运营
        - paragraph [ref=e68]:
          - text: 我们
          - strong [ref=e69]: 不会
          - text: 出售、交易或以其他方式向第三方转让您的个人身份信息。
        - heading "4. 数据安全" [level=2] [ref=e70]
        - list [ref=e71]:
          - listitem [ref=e72]: 本站为静态网站，不使用数据库，不存储用户提交的个人信息
          - listitem [ref=e73]: 所有数据传输通过 HTTPS 加密
          - listitem [ref=e74]: 主题偏好等本地数据仅存储在您的浏览器中
        - heading "5. 您的权利" [level=2] [ref=e75]
        - paragraph [ref=e76]: 根据适用的数据保护法律，您有权：
        - list [ref=e77]:
          - listitem [ref=e78]: 访问我们持有的关于您的个人数据
          - listitem [ref=e79]: 要求更正或删除您的个人数据
          - listitem [ref=e80]: 拒绝或限制数据处理
          - listitem [ref=e81]: 数据可携带权
        - paragraph [ref=e82]: 如需行使上述权利，请通过下方联系方式与我们联系。
        - heading "6. 儿童隐私" [level=2] [ref=e83]
        - paragraph [ref=e84]: 本站内容面向软件开发人员，不针对 13 岁以下儿童。我们不会有意收集儿童的个人信息。
        - heading "7. 政策更新" [level=2] [ref=e85]
        - paragraph [ref=e86]: 我们可能会不时更新本隐私政策。更新后的政策将在本页发布，并修改”最后更新”日期。继续使用本站即表示您同意更新后的政策。
        - heading "8. 联系方式" [level=2] [ref=e87]
        - paragraph [ref=e88]: 如果您对本隐私政策有任何疑问，请通过以下方式联系我们：
        - list [ref=e89]:
          - listitem [ref=e90]:
            - strong [ref=e91]: 邮箱
            - text: ：zhouxunyou@gmail.com
          - listitem [ref=e92]:
            - strong [ref=e93]: GitHub
            - text: ：
            - link "zhouxunyou" [ref=e94] [cursor=pointer]:
              - /url: https://github.com/zhouxunyou
