<footer class="gh-footer" role="contentinfo">
  <div class="gh-footer-inner">
    <ul class="gh-footer-links">
      <li>&copy; <span id="gh-year">2026</span></li>
      <li><a href="https://gwzz.xyz">gwzz.xyz</a></li>
      <li><a href="{% if page.lang == 'en' %}/en/privacy-policy/{% else %}/privacy-policy/{% endif %}">{% if page.lang == 'en' %}Privacy{% else %}隐私政策{% endif %}</a></li>
      <li><a href="{% if page.lang == 'en' %}/en/cookie-policy/{% else %}/cookie-policy/{% endif %}">{% if page.lang == 'en' %}Cookies{% else %}Cookie{% endif %}</a></li>
    </ul>
    <p class="gh-footer-motto">{{ strings.home.hero_tagline }} — {{ strings.home.hero_subtitle }}</p>
  </div>
  <script>document.getElementById('gh-year').textContent=new Date().getFullYear();</script>
</footer>
