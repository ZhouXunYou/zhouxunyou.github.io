{% include home/i18n.html %}
{% include home/stats.html lang=page_lang %}
<section class="gh-hero">
  <img class="gh-hero-avatar" src="/assets/images/avatar-placeholder.png" alt="GWZZ" width="80" height="80">
  <h1 class="gh-hero-brand">GWZZ</h1>
  <p class="gh-hero-tagline">{{ s.home.hero_tagline }}</p>
  <p class="gh-hero-subtitle">{{ s.home.hero_subtitle }}</p>
  <div class="gh-hero-stats">
    <span class="gh-hero-stat">
      <strong>{{ project_count }}</strong> {{ s.home.hero_articles }}
    </span>
    <span class="gh-hero-stat-divider">·</span>
    <span class="gh-hero-stat">
      <strong>{{ domain_count }}</strong> {{ s.home.hero_domains }}
    </span>
    <span class="gh-hero-stat-divider">·</span>
    <span class="gh-hero-stat">
      <strong>{{ active_count }}</strong> {{ s.home.hero_categories }}
    </span>
  </div>
</section>
