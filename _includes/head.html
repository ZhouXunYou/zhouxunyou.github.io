<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  {% if page.seo_keywords %}
  <meta name="keywords" content="{{ page.seo_keywords | escape }}">
  {% endif %}

  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="{% if page_lang == 'en' %}en_US{% else %}zh_CN{% endif %}">
  <meta property="og:image" content="{{ page.image | default: site.og_image | default: '/assets/images/og-default.png' | absolute_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ site.github_username }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="twitter:image" content="{{ page.image | default: site.og_image | default: '/assets/images/og-default.png' | absolute_url }}">

  <!-- Theme color (matches header bg) -->
  <meta name="theme-color" content="#24292f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{{ '/assets/manifest.json' | relative_url }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ site.title | jsonify }},
    "url": {{ site.url | jsonify }},
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ site.url }}/?q=\u007Bsearch_term_string\u007D",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {%- if page.layout == 'post' -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
    "author": {
      "@type": "Person",
      "name": {{ site.author | jsonify }}
    },
    "publisher": {
      "@type": "Organization",
      "name": {{ site.title | jsonify }}
    },
    "description": {{ page.description | default: page.excerpt | default: "" | strip_html | normalize_whitespace | truncate: 160 | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "inLanguage": {{ page.lang | default: "zh" | jsonify }}
  }
  </script>
  {%- endif -%}

  <!-- Prevent flash: set theme before CSS paints -->
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preload" href="{{ '/assets/main.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/sidebar.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/code-copy.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/share.js' | relative_url }}" defer></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="module">
    if (document.querySelector('code.language-mermaid')) {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
      mermaid.initialize({ theme: 'default' });
      document.querySelectorAll('code.language-mermaid').forEach(function(code) {
        var pre = code.parentElement;
        pre.classList.add('mermaid');
        pre.innerHTML = code.textContent;
      });
      mermaid.run();
    }
  </script>
  {% if site.google_adsense %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.google_adsense }}" crossorigin="anonymous"></script>
  {% endif %}
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('{{ "/assets/js/sw.js" | relative_url }}');
      });
    }
  </script>
  {%- if site.umami and site.umami.enabled -%}
  <script async src="{{ site.umami.src }}" data-website-id="{{ site.umami.website_id }}"></script>
  {%- endif -%}
</head>
