<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>

  <!-- Prevent flash: set theme before CSS paints -->
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/sidebar.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    document.addEventListener('DOMContentLoaded', function() {
      // Jekyll renders ```mermaid as <pre><code class="language-mermaid">
      // Mermaid needs <pre class="mermaid"> or <div class="mermaid">
      document.querySelectorAll('code.language-mermaid').forEach(function(code) {
        var pre = code.parentElement;
        pre.classList.add('mermaid');
        pre.innerHTML = code.textContent;
      });

      mermaid.initialize({ startOnLoad: true, theme: 'default' });
    });
  </script>
</head>
