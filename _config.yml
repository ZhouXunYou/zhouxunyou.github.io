title: "Zhou Xunyou"
email: your-email@example.com
description: "Developer / Open Source Enthusiast"
baseurl: ""
url: "https://gwzz.xyz"
author: "Zhou Xunyou"
github_username: zhouxunyou
location: "China"
# avatar: "/assets/images/avatar.png"  # Uncomment and set path when adding a real avatar image

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Collections
collections:
  projects:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "repo"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - CODEBUDDY.md
  - README.md
