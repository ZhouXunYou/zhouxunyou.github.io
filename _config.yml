title: "格物致知"
email: zhouxunyou@gmail.com
description: "Developer / Open Source Enthusiast"
baseurl: ""
url: "https://gwzz.xyz"
author: "Zhou Xunyou"
github_username: zhouxunyou
github:
  username: zhouxunyou
location: "China"
avatar: "/assets/images/avatar.svg"

# Google AdSense
google_adsense: ca-pub-1609698158812333

# Umami Analytics (privacy-friendly) — uncomment and fill in to enable
umami:
  # enabled: true
  # src: https://analytics.example.com/script.js
  # website_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
og_image: "/assets/images/og-default.svg"

# i18n
default_lang: zh
languages:
  - code: zh
    name: 中文
  - code: en
    name: English

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-minifier

# Feed: include projects collection
feed:
  collections:
    projects:
      output: true

# Collections
collections:
  projects:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "repo"
      sidebar: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      sidebar: false
  - scope:
      path: ""
    values:
      layout: "page"

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - CODEBUDDY.md
  - README.md

jekyll-minifier:
  compress_html: true
  compress_css: true
  compress_js: true
  exclude: ['search.json', 'feed.xml']

# Link Gate (Cloudflare Worker)
link_gate_api: https://gwzz-link-gate.gwzz.workers.dev
link_gate_ad_slot: 1234567890
