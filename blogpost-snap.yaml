          - heading "缓存头详解" [level=2] [ref=e290]
          - paragraph [ref=e291]: HTTP 缓存通过请求/响应头控制，分为强缓存和协商缓存：
          - generic [ref=e292]:
            - code [ref=e294]: "flowchart TD A[浏览器请求资源] --> B{强缓存有效?} B -->|Cache-Control/max-age 未过期| C[直接使用本地缓存 200] B -->|已过期或无强缓存| D{协商缓存} D --> E[发送请求 携带 ETag/If-None-Match<br/>Last-Modified/If-Modified-Since] E --> F{资源未修改?} F -->|是| G[返回 304 Not Modified] F -->|否| H[返回 200 + 新资源]"
            - button "Copy code" [ref=e295] [cursor=pointer]:
              - img [ref=e296]
          - paragraph [ref=e299]:
            - strong [ref=e300]: 强缓存头
            - text: ：
          - list [ref=e301]:
            - listitem [ref=e302]:
              - code [ref=e303]: "Cache-Control: max-age=3600"
              - text: — 资源在 3600 秒内有效
            - listitem [ref=e304]:
              - code [ref=e305]: "Cache-Control: no-cache"
              - text: — 跳过强缓存，走协商缓存
            - listitem [ref=e306]:
              - code [ref=e307]: "Cache-Control: no-store"
              - text: — 完全不缓存
          - paragraph [ref=e308]:
            - strong [ref=e309]: 协商缓存头
            - text: ：
          - list [ref=e310]:
            - listitem [ref=e311]:
              - code [ref=e312]: ETag
              - text: /
              - code [ref=e313]: If-None-Match
              - text: — 基于内容哈希，精确但耗 CPU
            - listitem [ref=e314]:
              - code [ref=e315]: Last-Modified
              - text: /
              - code [ref=e316]: If-Modified-Since
              - text: — 基于修改时间，精度秒级
          - paragraph [ref=e317]:
            - text: 实战建议：静态资源（JS/CSS/图片）使用内容哈希文件名 + 长期强缓存；HTML 使用
            - code [ref=e318]: no-cache
            - text: 走协商缓存；API 响应根据业务语义设置缓存策略。
