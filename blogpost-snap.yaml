        - generic [ref=e109]:
          - heading "HTTP 协议演进" [level=2] [ref=e110]
          - paragraph [ref=e111]: HTTP（HyperText Transfer Protocol）是 Web 通信的基石。从 HTTP/1.0 到 HTTP/3，协议经历了三次重大升级，每次都在解决前一代的核心痛点：
          - table [ref=e112]:
            - rowgroup [ref=e113]:
              - row "版本 核心改进 解决的问题" [ref=e114]:
                - columnheader "版本" [ref=e115]
                - columnheader "核心改进" [ref=e116]
                - columnheader "解决的问题" [ref=e117]
            - rowgroup [ref=e118]:
              - row "HTTP/1.0 短连接 基础通信" [ref=e119]:
                - cell "HTTP/1.0" [ref=e120]
                - cell "短连接" [ref=e121]
                - cell "基础通信" [ref=e122]
              - row "HTTP/1.1 持久连接 连接复用" [ref=e123]:
                - cell "HTTP/1.1" [ref=e124]
                - cell "持久连接" [ref=e125]
                - cell "连接复用" [ref=e126]
              - row "HTTP/2 多路复用 队头阻塞" [ref=e127]:
                - cell "HTTP/2" [ref=e128]
                - cell "多路复用" [ref=e129]
                - cell "队头阻塞" [ref=e130]
              - row "HTTP/3 QUIC 传输 传输层阻塞" [ref=e131]:
                - cell "HTTP/3" [ref=e132]
                - cell "QUIC 传输" [ref=e133]
                - cell "传输层阻塞" [ref=e134]
          - heading "HTTP/1.1：持久连接与队头阻塞" [level=2] [ref=e135]
          - paragraph [ref=e136]:
            - text: HTTP/1.1 引入了持久连接（Persistent Connection），默认
            - code [ref=e137]: "Connection: keep-alive"
            - text: ，允许在同一个 TCP 连接上发送多个请求。同时支持管线化（Pipelining），即无需等待响应即可发送下一个请求。
          - paragraph [ref=e138]:
            - text: 但管线化存在严重的
            - strong [ref=e139]: 队头阻塞（Head-of-Line Blocking）
            - text: 问题：即使多个请求同时发出，服务器仍需按顺序响应。如果第一个请求处理缓慢，后续请求必须排队等待。
          - generic [ref=e140]:
            - code [ref=e142]: "sequenceDiagram participant C as 客户端 participant S as 服务器 Note over C,S: HTTP/1.1 管线化请求 C->>S: 请求 1 (耗时操作) C->>S: 请求 2 C->>S: 请求 3 Note over S: 请求1 处理中...请求2、3 排队等待 S-->>C: 响应 1 S-->>C: 响应 2 S-->>C: 响应 3 Note over C,S: HTTP/2 多路复用 C->>S: Stream 1 (请求1) C->>S: Stream 3 (请求2) C->>S: Stream 5 (请求3) S-->>C: Stream 3 响应2 (先完成先返回) S-->>C: Stream 1 响应1 S-->>C: Stream 5 响应3"
            - button "Copy code" [ref=e143] [cursor=pointer]:
              - img [ref=e144]
          - paragraph [ref=e147]:
            - text: 浏览器通常采用
            - strong [ref=e148]: 多连接并发
            - text: 策略（Chrome 最多 6 个 TCP 连接/域名）来绕过队头阻塞，但这又带来了连接开销和资源浪费。
          - heading "HTTP/2：多路复用与头部压缩" [level=2] [ref=e149]
          - paragraph [ref=e150]: HTTP/2 在应用层引入了三个核心机制：
          - heading "1. 二进制分帧与多路复用" [level=3] [ref=e151]
          - paragraph [ref=e152]:
            - text: HTTP/2 将请求和响应分割为更小的
            - strong [ref=e153]: 帧（Frame）
            - text: ，并在一个 TCP 连接上通过
            - strong [ref=e154]: 流（Stream）
            - text: 交错传输：
          - list [ref=e155]:
            - listitem [ref=e156]:
              - strong [ref=e157]: 帧（Frame）
              - text: ：最小通信单位，包含帧头（类型、长度、流标识符）和帧体
            - listitem [ref=e158]:
              - strong [ref=e159]: 消息（Message）
              - text: ：一个完整的请求或响应，由多个帧组成
            - listitem [ref=e160]:
              - strong [ref=e161]: 流（Stream）
              - text: ：双向字节流，每个流有唯一 ID，不同流的帧可以交错传输
          - paragraph [ref=e162]: 这种设计彻底解决了应用层的队头阻塞——不同流的帧可以交错发送，慢请求不会阻塞快请求。
          - heading "2. HPACK 头部压缩" [level=3] [ref=e163]
          - paragraph [ref=e164]: HTTP/1.1 的请求头是纯文本，大量重复（如 Cookie、User-Agent），浪费带宽。HPACK 通过两种机制压缩头部：
          - list [ref=e165]:
            - listitem [ref=e166]:
              - strong [ref=e167]: 静态表
              - text: ：预定义 61 个常见头部字段（如
              - code [ref=e168]: ":method: GET"
              - text: 编号为 2）
            - listitem [ref=e169]:
              - strong [ref=e170]: 动态表
              - text: ：连接级别共享，缓存之前出现过的头部键值对
            - listitem [ref=e171]:
              - strong [ref=e172]: 哈夫曼编码
              - text: ：对字符串值进行压缩
          - paragraph [ref=e173]: 实际场景中，HPACK 可减少 80%+ 的头部开销。
          - heading "3. 服务器推送" [level=3] [ref=e174]
          - paragraph [ref=e175]:
            - text: 服务器可以主动向客户端推送资源，无需等待客户端请求。典型场景：客户端请求
            - code [ref=e176]: index.html
            - text: ，服务器同时推送
            - code [ref=e177]: style.css
            - text: 和
            - code [ref=e178]: app.js
            - text: 。
          - generic [ref=e181]:
            - code [ref=e183]: PUSH_PROMISE :stream_id 2 :path /style.css HEADERS :stream_id 2 :status 200 DATA :stream_id 2 <css content>
            - button "Copy code" [ref=e184] [cursor=pointer]:
              - img [ref=e185]
          - heading "HTTP/3：QUIC 协议" [level=2] [ref=e188]
          - paragraph [ref=e189]:
            - text: HTTP/2 虽然解决了应用层队头阻塞，但 TCP 层仍存在该问题——一个 TCP 包丢失会导致整个连接阻塞。HTTP/3 基于
            - strong [ref=e190]: QUIC（Quick UDP Internet Connections）
            - text: 协议，彻底摆脱了 TCP 的限制：
          - generic [ref=e191]:
            - code [ref=e193]: graph LR subgraph "HTTP/2 传输栈" A[HTTP/2 帧] --> B[TCP] B --> C[TLS 1.2/1.3] C --> D[IP] end subgraph "HTTP/3 传输栈" E[HTTP/3 帧] --> F[QUIC] F --> G[UDP] G --> H[IP] end
            - button "Copy code" [ref=e194] [cursor=pointer]:
              - img [ref=e195]
          - paragraph [ref=e198]: QUIC 的核心优势：
          - list [ref=e199]:
            - listitem [ref=e200]:
              - strong [ref=e201]: 传输层多路复用
              - text: ：每个流独立交付，一个流丢包不影响其他流
            - listitem [ref=e202]:
              - strong [ref=e203]: 0-RTT 连接建立
              - text: ：首次连接 1-RTT，后续连接可 0-RTT 恢复
            - listitem [ref=e204]:
              - strong [ref=e205]: 连接迁移
              - text: ：基于 Connection ID 而非四元组识别连接，WiFi 切 4G 无需重建连接
            - listitem [ref=e206]:
              - strong [ref=e207]: 内置加密
              - text: ：QUIC 强制 TLS 1.3，协议握手与加密握手合并
          - heading "HTTPS 与 TLS 握手" [level=2] [ref=e208]
          - paragraph [ref=e209]: HTTPS = HTTP + TLS，在传输层对数据进行加密。TLS 1.3 握手流程已大幅简化：
          - generic [ref=e210]:
            - code [ref=e212]: "sequenceDiagram participant C as 客户端 participant S as 服务器 Note over C,S: TLS 1.3 完整握手 (1-RTT) C->>S: ClientHello + Key Share S-->>C: ServerHello + Key Share + Certificate + Finished C->>S: Finished Note over C,S: 应用数据传输开始 Note over C,S: TLS 1.3 恢复握手 (0-RTT) C->>S: ClientHello + Key Share + Early Data Note over C,S: 0-RTT 应用数据已随握手发出 S-->>C: ServerHello + Key Share + Finished"
            - button "Copy code" [ref=e213] [cursor=pointer]:
              - img [ref=e214]
          - paragraph [ref=e217]: TLS 1.3 相比 1.2 的改进：
          - list [ref=e218]:
            - listitem [ref=e219]: 握手从 2-RTT 缩短为 1-RTT
            - listitem [ref=e220]: 移除了不安全的密码套件（如 RSA 密钥交换、CBC 模式）
            - listitem [ref=e221]: 支持 0-RTT 恢复，适合延迟敏感场景
          - heading "常见状态码语义" [level=2] [ref=e222]
          - table [ref=e223]:
            - rowgroup [ref=e224]:
              - row "状态码 含义 典型场景" [ref=e225]:
                - columnheader "状态码" [ref=e226]
                - columnheader "含义" [ref=e227]
                - columnheader "典型场景" [ref=e228]
            - rowgroup [ref=e229]:
              - row "200 OK 请求成功" [ref=e230]:
                - cell "200" [ref=e231]
